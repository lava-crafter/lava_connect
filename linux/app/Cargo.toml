[package]
name = "lava-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
lava-core.workspace = true
slint = { version = "1.13", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
ksni = "0.3"
tokio.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }

[build-dependencies]
slint-build = "1.13"
