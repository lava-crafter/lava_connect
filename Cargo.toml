[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "bindings/android-jni", "linux/app"]
default-members = ["linux/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
tracing = "0.1"
lava-core = { path = "crates/core" }
lava-protocol = { path = "crates/protocol" }
