syntax = "proto3";
package lava.connect.v1;

enum Platform {
  PLATFORM_UNKNOWN = 0;
  PLATFORM_ANDROID = 1;
  PLATFORM_LINUX = 2;
}
enum Capability {
  CAPABILITY_UNKNOWN = 0;
  CLIPBOARD_TEXT = 1;
  CLIPBOARD_IMAGE = 2;
}
message DeviceInfo {
  string id = 1; // SHA-256 of the DER identity certificate
  string name = 2;
  Platform platform = 3;
  string version = 4;
  repeated Capability capabilities = 5;
  uint32 protocol_version = 6;
}
message PairRequest {}
message PairConfirm {}
message PairCancel {}
message Ping {}
message Ready { repeated Capability allowed = 1; }
message ClipboardPayload {
  string id = 1;
  string origin_device_id = 2;
  bytes content_hash = 3;
  string mime_type = 4;
  bytes data = 5;
  int64 timestamp = 6;
}
message Envelope {
  oneof body {
    DeviceInfo hello = 1;
    PairRequest pair_request = 2;
    PairConfirm pair_confirm = 3;
    PairCancel pair_cancel = 4;
    Ready ready = 5;
    ClipboardPayload clipboard = 6;
    Ping ping = 7;
  }
}
