[package]
name = "lava-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
lava-protocol.workspace = true
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", features = ["ring"] }
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["v4"] }
mdns-sd = "0.21.6"
aes-gcm = "0.11.1"
rand = "0.10.3"
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
